<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>The flow: guest's phone → Gauri (demo)</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #e7dcc6; color: #2a1c12; }
      h1 { font-size: 1.2rem; text-align: center; margin: 1rem 1rem 0.2rem; }
      p.note { text-align: center; margin: 0 1rem 1rem; font-size: 0.9rem; color: #5e4c3e; }
      .stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1.5rem; padding: 0 1rem 2rem; }
      figure { margin: 0; text-align: center; }
      figcaption { font-weight: 700; margin-bottom: 0.5rem; }
      figcaption small { display: block; font-weight: 400; color: #5e4c3e; }
      iframe { width: 390px; height: 780px; max-width: 94vw; border: 10px solid #1d1b19; border-radius: 2.4rem; background: #fff; box-shadow: 0 18px 40px rgb(40 30 10 / 0.3); }
      .arrow { font-size: 2.5rem; color: #155e3b; font-weight: 700; }
      @media (max-width: 900px) { .arrow { transform: rotate(90deg); } }
    </style>
  </head>
  <body>
    <h1>From a guest's message to the owner's summary</h1>
    <p class="note">Demo with a simulated guest phone: no real SMS is sent. In real use the guest's SMS or WhatsApp message is shared or pasted into Gauri.</p>
    <div class="stage">
      <figure>
        <figcaption>1. The guest's phone <small>writes in their own language</small></figcaption>
        <iframe src="/guest.html" title="Guest's phone (simulated messaging app)"></iframe>
      </figure>
      <div class="arrow" aria-hidden="true">→</div>
      <figure>
        <figcaption>2. Noor's phone: Gauri <small>reads it on the device, in her language</small></figcaption>
        <iframe src="/" title="Gauri on the owner's phone"></iframe>
      </figure>
    </div>
  </body>
</html>
